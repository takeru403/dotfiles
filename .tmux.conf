# .tmux.conf

# ===============================
# 基本設定
# ===============================
# prefix キーを Ctrl-g に変更
unbind C-b
set -g prefix C-g
bind C-g send-prefix

# ===============================
# ウィンドウ・ペイン操作
# ===============================
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"

# vim キーバインドでペイン移動（prefix あり）
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# vim-tmux-navigator: vim 起動中は vim に渡し、それ以外はペイン移動
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# ペインサイズ変更
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# ===============================
# マウス
# ===============================
set -g mouse on

# ===============================
# コピー・ペースト
# ===============================
setw -g mode-keys vi
set -s set-clipboard off

# OS 判定でクリップボードコマンドを切り替え
if-shell -b '[ "$(uname)" = "Linux" ]' {
  set -s copy-command "xsel --clipboard --input"
}
if-shell -b '[ "$(uname)" = "Darwin" ]' {
  set -s copy-command "pbcopy"
}

bind -Tcopy-mode-vi v send -X begin-selection
bind -Tcopy-mode-vi y send -X copy-pipe-and-cancel
bind -Tcopy-mode-vi MouseDragEnd1Pane send -X copy-pipe
bind -Tcopy-mode-vi MouseDown1Pane send -X clear-selection

# ===============================
# 表示設定
# ===============================
set -g default-terminal "screen-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

# ステータスバー
set -g status-bg colour235
set -g status-fg colour136
set -g status-left-length 20
set -g status-left '#[fg=green][#S] '
set -g status-right '#[fg=yellow]#(whoami)@#h #[fg=green]%Y-%m-%d %H:%M'

# ペインボーダー
set -g pane-border-lines heavy
set -g pane-border-style 'fg=colour240'
set -g pane-active-border-style 'fg=colour46 bold'
set -g window-style 'fg=colour250,bg=default'
set -g window-active-style 'fg=colour255,bg=default'

# ペインタイトル（上部表示、アクティブペインを緑強調）
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=colour46 bold] > #I:#{?#{==:#T,#h},#{s|#{E:HOME}/ghq/[^/]*/[^/]*/||s|#{E:HOME}|~|:pane_current_path},#T} ,#[fg=colour240] #I:#{?#{==:#T,#h},#{s|#{E:HOME}/ghq/[^/]*/[^/]*/||s|#{E:HOME}|~|:pane_current_path},#T} }"

# ウィンドウタブ
setw -g window-status-current-format ' #I:#W#F '
setw -g window-status-current-style 'fg=colour1 bg=colour7 bold'
setw -g window-status-format ' #I:#W#F '

# ===============================
# その他設定
# ===============================
# ウィンドウ番号を 1 から開始・詰める
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# エスケープキーの遅延をなくす
set -sg escape-time 0

# 履歴
set -g history-limit 10000

# アクティビティ監視
setw -g monitor-activity on
set -g visual-activity on

# ===============================
# AI 開発用
# ===============================
# 新ウィンドウで claude を起動
bind c new-window -c "#{pane_current_path}" \; send-keys "claude" Enter

# 新ウィンドウで gemini を起動
bind g new-window -c "#{pane_current_path}" \; send-keys "gemini" Enter

# ===============================
# 設定リロード
# ===============================
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"
